# config/column_maps/sales_return.yaml
#
# Maps confirmed Del Monte Sales Return file column vocabulary onto one
# canonical schema. Checked directly against 7 of the 19 real files
# (2023-01, 2023-09, 2023-11, 2023-12, 2024-01, 2025-03, 2025-04,
# 2025-12) spanning all three real template shapes:
#   - Shape A (Jan-Dec 2023): single sheet per region, 13 columns, no
#     Branch Code / Town Display / Return Type.
#   - Shape B (Jan-Feb 2024, at least): adds Salesman/Town Display/
#     Branch Code, 15 columns. Still no Return Type.
#   - Shape C (Mar 2025 onward, at least): sheets split GS/BO per
#     region, adds Return Type, 16 columns.
# Column ORDER differs between shapes (Shape A puts Invoice Num/REFNBR
# right after Invoice Date; Shape B/C put Salesman/Town Display/Branch
# Code first) - irrelevant here since matching is by header name, not
# position (see transform.py's _normalize_header()).
#
# Nearly identical to sales_register.yaml's vocabulary (bo_rmr_gs.py's
# own docstring already noted "same invoice-level column vocabulary as
# Sales Register" for the GS/BO shape) - field names below match that
# file's canonical names for consistency, in case these are ever
# reconciled into one driver. Only vocab confirmed in real Sales Return
# headers is listed; sales_register.yaml's AREA/Area region variants
# and REFERENCE # invoice_num variant have not been observed here and
# are deliberately not carried over - add them if a real file shows them.
#
# Extract leaves raw column names untouched; Transform applies this map.
# Matching is case-insensitive and whitespace-normalized (see transform.py) -
# note Shape C's Ilocos sheets carry "Return Type " with a trailing space,
# which normalizes to the same key as "Return Type" without one.

invoice_date:
  - "Invoice Date"

salesman:
  - "Salesman"

region:
  - "Town Display"    # Shape B/C only - absent in Shape A real files

customer_name:
  - "Customer Name"

invoice_num:
  - "Invoice Num"
  - "REFNBR"           # same collision as sales_register.yaml's pair -
                        # transform.py's _coalesce_duplicate_columns()
                        # already handles a batch mixing both vocabs

untaxed_amount:
  - "Untaxed Amount"

discount_rate_label:
  - "Discount Rate"    # text label (e.g. "Public Pricelist", "LESS 3%"),
                        # never coerce to numeric - same as sales_register.yaml

discount_amount:
  - "Discount Amount"

tax_amount:
  - "Tax"

net_amount:
  - "Net Amount"

balance:
  - "Balance"

return_slip_num:
  - "Return Slip #"

return_type:
  - "Return Type"      # Shape C only ("GS"/"BO") - absent in Shape A/B
                        # real files; those rows get return_type=NULL,
                        # see schema.sql's SalesReturn_Fact comment

branch_code:
  - "Branch Code"       # Shape B/C only - absent in Shape A real files

# "Posted" - deliberately NOT mapped, same as sales_register.yaml /
# purchase_order.yaml: a workflow status flag, no destination column.
