# config/column_maps/sales_return.yaml
#
# Maps the Sales Return file column vocabulary onto SalesReturn_Fact.
# Built 2026-09-09 (Phase 1 re-check) when sales_return replaced rmr_gs_bo
# as the system of record for this fact (see config/source_of_truth.yaml).
#
# Verified directly against the 68 staged sales_return parquet files
# (1,931 rows, 2023-01 -> 2026-08, both regions, all Del Monte). Every
# staged sheet shares one column shape:
#   Invoice Date, Salesman, Town Display, Branch Code, Customer Name,
#   Invoice Num, REFNBR, Untaxed Amount, Discount Rate, Discount Amount,
#   Tax, Net Amount, Balance, Posted, Return Slip #, Return Type
# This is the same vocabulary as sales_register.yaml's vocab A (returns
# are recorded in the sales-register format), plus "Return Slip #" and
# "Return Type".
#
# Extract leaves raw column names untouched; Transform applies this map.
# Matching is case-insensitive and whitespace-normalized (see transform.py).
#
# GRAIN / SOURCE-OF-TRUTH (DEC-04): _sheet_role is gs / bo / data /
# one_pager. gs + bo + data load; one_pager (GS union BO, 2025 shape only)
# is a cross-check. See source_of_truth.yaml's sales_return.both entry.
#
# NOT MAPPED, on purpose:
#   - region      -> comes from Extract's _region provenance (site level:
#                    pangasinan / ilocos) via transform.backfill_provenance_fields().
#                    "Town Display" is the TOWN (half-blank), not the region -
#                    do not map it to `region` (that is rmr_gs_bo.yaml's latent bug).
#   - principal   -> from _principal provenance, same mechanism.
#   - return_date -> the sheet has only "Invoice Date" (the original sale
#                    date), which is NOT the return date. Mapping it to
#                    return_date would be semantically wrong AND return_date
#                    is a Date_Dimension FK. Left NULL until a real return
#                    date column is confirmed. Flagged, not guessed.
#   - bo_units    -> no source column exists (schema.sql: "always NULL for
#                    real data"). BO value trend uses net_amount, not units.
#   - Salesman, Town Display, Branch Code, Customer Name, REFNBR,
#     Untaxed Amount, Discount Rate, Discount Amount, Tax, Balance, Posted
#                 -> no column on SalesReturn_Fact. The canonical loader
#                    projects to schema columns before load; these are
#                    dropped there, not here.

return_slip_num:
  - "Return Slip #"

invoice_num:
  - "Invoice Num"     # e.g. "INV/2024/0618" - present on 1,912/1,931 rows.
                       # Not in the natural key (schema.sql keeps the key as
                       # (return_slip_num, principal, region, return_type));
                       # kept as a real attribute and a migration-0011
                       # candidate for tightening the key.

return_type:
  - "Return Type"      # values confirmed: "GS" / "BO" / NULL (pre-2025
                        # "data" shape has no split). 11 staged rows carry
                        # the literal string "Return Type" (an unstripped
                        # header row) - a real data-quality issue, surfaced
                        # by transform_driver, not silently coerced here.

net_amount:
  - "Net Amount"
# X4 (2026-09-22): GS/BO sheets of the Sept + Dec 2025 exports. Invoice totals
# across mixed products; bo_units stays NULL (a BO row is marked by return_type only).
quantity_cases:
  - "Total CAS"
quantity_pieces:
  - "Total PCS"

# Phase 4 (2026-08, is_demo load-bearing): only ever present on synthetic
# demo rows - no real Sales Return file has this header. schema.sql's
# DEFAULT false handles real rows at Load time.
is_demo:
  - "is_demo"
