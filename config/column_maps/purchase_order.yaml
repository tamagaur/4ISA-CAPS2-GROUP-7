# config/column_maps/purchase_order.yaml
# (an earlier fix attempt renamed this to purchases.yaml, matching
# source_of_truth.yaml's old, since-corrected "purchases" label — DEC-07
# reverted that direction: this filename must match Extract's real
# _doc_type tag "purchase_order" for load_column_map() to resolve. See
# source_of_truth.yaml's top-of-file note for the full story.)
#
# Maps confirmed Del Monte Purchase file column vocabularies onto one
# canonical schema. Checked against profiling/sheet_profiles for both
# regions (Ilocos/Pangasinan) and both 2023 and 2025 exports - vocab is
# stable across that whole span, only one real drift spotted (see
# return_type below).
#
# Extract leaves raw column names untouched; Transform applies this map.
# Matching is case-insensitive and whitespace-normalized (see transform.py).
#
# NOTE: this file's template is nearly identical to sales_register.yaml's
# (same POS export tool), but it is a DIFFERENT relationship - "Customer
# Name" here holds the SUPPLIER'S name (e.g. "DMPI" = Del Monte Philippines
# Inc., who Sansan buys FROM), not a customer. Do not merge this map with
# sales_register.yaml's or alias supplier_name into customer_name.

# Phase 4 (2026-08, is_demo load-bearing): only ever present on synthetic
# demo rows (see data/raw/Synthetic Data/, reports/SYNTHETIC_DATA_AUDIT.md) -
# no real Purchase Order file has this header. Real files simply won't
# have this raw column, so apply_column_map() leaves the canonical
# is_demo field absent for them entirely; it is NOT backfilled to False
# here. schema.sql's is_demo BOOLEAN NOT NULL DEFAULT false column
# handles that instead - load.py only inserts columns present in both
# the DataFrame and the target table (see load.py's df_columns
# construction), so a real row's INSERT simply omits is_demo and
# Postgres applies its own DEFAULT false. Confirmed by code inspection,
# not by running load.py (not run this session, per instruction).
is_demo:
  - "is_demo"

invoice_date:
  - "Invoice Date"

salesman:
  - "Salesman"      # site/branch label in this file (e.g. "ILOCOS SITE"), not a person - kept as-is, not renamed to avoid asserting more than the header says

# region: deliberately NOT mapped (removed 2026-09-11, Phase 1 step 2b).
# Was mapped from "Town Display", but for this file family that raw column
# is unusable: confirmed 1,106/2,703 staged rows carry the literal text
# "FALSE" (two dtypes: bool False and str 'False' - an unresolved Excel
# formula artifact in the source, not something this pipeline introduced),
# and the remainder is either genuinely blank or a town name with no
# discriminating value here (unlike sales_register, where town-level region
# is real signal - see transform.py's backfill_provenance_fields docstring).
# transform.backfill_provenance_fields() only fills true NULLs, so the
# literal "FALSE" values blocked the clean site-level _region provenance
# tag (pangasinan/ilocos, 100% populated, sourced from the sheet names
# "ILOCOS PURCHASE"/"PANGASINAN PURCHASE") from ever reaching `region`.
# Leaving this unmapped lets backfill_provenance_fields fill `region`
# cleanly from _region for every row. Confirmed downstream: no backend
# router, schema, or frontend file reads Purchase_Fact.region today (Phase 1
# step 2a) - this was a live-but-inert defect, not one that changes any
# reported number, but 223/353 real live purchase_fact rows already carry
# the bad value; fixing this mapping is forward-only and does not touch
# those live rows (that is a Phase 1d cutover question).

branch_code:
  - "Branch Code"

supplier_name:
  - "Customer Name"   # NOTE: despite the header, this is the supplier (DMPI) in a purchase file - see module note above

invoice_num:
  - "Invoice Num"     # e.g. "BILL/2025/0127" - this is the natural key half used in schema.sql's UNIQUE(invoice_num, principal, region)

po_reference:
  - "REFNBR"          # e.g. "PO01391" - a purchase-order reference, NOT the same thing as sales_register.yaml's REFNBR (which aliased invoice_num there). Do not conflate the two files' REFNBR meanings.

untaxed_amount:
  - "Untaxed Amount"

discount_rate_label:
  - "Discount Rate"   # text label (e.g. "Public Pricelist"), never coerce to numeric

discount_amount:
  - "Discount Amount"

tax_amount:
  - "Tax"

net_amount:
  - "Net Amount"

balance:
  - "Balance"

return_slip_num:
  - "Return Slip #"

return_type:
  - "Return Type"
  - "Returns"          # vocab drift confirmed in PANGASINAN 2025 exports

# --- Columns seen in the source but deliberately NOT mapped here ---
# "Posted"                    - a workflow status flag, not part of the canonical
#                               fact schema; no destination column exists for it.
# "Net Amount ( Actual Invoice)" - appears only in some 2025 exports, sits right next
#                               to "Net Amount". Likely a cross-check/echo column
#                               (same pattern as Sales Register's totals-row check),
#                               not confirmed as a second source of truth. Do NOT
#                               alias it into net_amount without confirming with
#                               Yuan which one is authoritative - that decision
#                               belongs in source_of_truth.yaml, not silently made
#                               here.
#
# OPEN ITEM FOR YUAN: schema.sql's Purchase_Fact table currently only has
# columns for net_amount, tax_amount, and units_received - it does NOT yet
# have columns for untaxed_amount, discount_amount, discount_rate_label,
# balance, salesman, or branch_code, even though this map surfaces them
# (Transform can rename them; Load will simply have nowhere to put them
# until Purchase_Fact is extended). Flagging so this isn't silently
# dropped on the floor at Load time - confirm which of these actually
# need to persist before extending the table.
# Also note: no literal "units" column exists anywhere in this file
# family - Purchase_Fact.units_received will need a decision on what
# feeds it (this file has no quantity column at all).
