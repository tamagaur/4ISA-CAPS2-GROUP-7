# config/source_of_truth.yaml
#
# Encodes ARCHITECTURE.md DEC-04 (§5.2): one system-of-record sheet_role
# per (fact, principal); everything else is a cross-check, never loaded.
# Transform filters staged tables against this map before dedup/grain work.
#
# doc_type here refers to the *refined* _doc_type tag Extract attaches
# (see ARCHITECTURE.md §6.5), not the file-selection family. Per DEC-07,
# these must be Extract's actual staged _doc_type values, verified
# directly against staging/_manifest.json — not a hand-picked label. The
# canonical 8: sales_register, daily_sales_report, purchase_order,
# inventory_sign_off, sell_out, rmr_gs_bo, unilever_sku, ssis_summary
# (extractor added T3 Option A, 2026-07 — see ARCHITECTURE.md §7). Plus
# ssis_soh (2026-08 — Extract-only so far, see inventory.unilever below;
# not yet wired into analytics/etl/extract/driver.py's FAMILY_PARSERS).

# NOTE on doc_type <-> column_maps/*.yaml naming: doc_type here must equal
# the filename (minus .yaml) of the map transform.py loads via
# load_column_map(), AND must equal Extract's real staged _doc_type value
# (see DEC-07 above) — those two constraints are the same constraint, not
# two. Previously "purchases" and "inventory" were guessed labels here
# that matched neither the column_map filenames nor Extract's actual
# output; an earlier fix attempt renamed the *files* to match the guessed
# labels instead (purchase_order.yaml -> purchases.yaml, etc.) — that
# direction breaks load_column_map() the moment real staged data
# (_doc_type="purchase_order") hits it, since staging/_manifest.json
# (gitignored, so easy to miss) confirms Extract never produces
# "purchases" or "inventory". Fixed by renaming the *labels* here instead,
# 2026-07 — see the per-entry DEC-07 fix comments below. transform_fact()
# derives doc_type from this rule automatically instead of taking it as a
# separate caller-supplied argument, so this file is the single source of
# truth for the pairing.

sales:
  # ─────────────────────────────────────────────────────────────────────
  # EXCLUDED — sales.unilever has NO fact destination (removed 2026-09-09,
  # Phase 1 re-check). The former entry declared
  #   doc_type: ssis_summary, system_of_record_role: raw_data,
  #   natural_key: null
  # which was a dead declaration: transform_fact() refuses natural_key=null,
  # AND Sales_Fact carries CHECK (principal = 'delmonte') (DEC-10) so it
  # structurally cannot hold Unilever rows. Phase 0 follow-up confirmed
  # (reports/PROJECT_STATE_2026-09.md §8): 0 real DB rows trace to
  # ssis_summary; 95.6% of its 1.95M rows are product-less outlet×day×
  # invoice sales VALUE with no SKU/article/item column of any kind
  # (verified across ~10 months). It is deliberately NOT loaded.
  #
  # With no `unilever:` (or `both:`) key here, transform_driver's
  # _doc_type_owners() gives ssis_summary NO owning (fact, principal), so
  # its ~805 staged sheets classify cleanly as `demoted` ("never a fact's
  # primary source") instead of `blocked` every run. ssis_summary stays a
  # cross_check_doc_types entry on inventory / sell_out below.
  #
  # The Unilever SKU-level demand fact is sourced from `unilever_sku`
  # (see sales_unilever_sku_demand below), NOT from ssis_summary.
  #
  # Del Monte invoice-grain sales continue below.
  # ─────────────────────────────────────────────────────────────────────
  delmonte:
    doc_type: sales_register
    system_of_record_role: data
    cross_check_roles: [scratch]
    # daily_sales_report is a DIFFERENT _doc_type (not a _sheet_role), so
    # cross_check_roles above can't catch it — both it and sales_register's
    # per-day sheets carry _sheet_role="data". Listing it here explicitly
    # so Transform's fact driver excludes it by _doc_type before any
    # _sheet_role filtering, preventing a daily-vs-monthly double count.
    # Its own column map exists (config/column_maps/daily_sales_report.yaml)
    # so Transform can tag/report on it — it is never promoted to load.
    cross_check_doc_types: [daily_sales_report]
    # 2026-09-21 (completeness audit F4): ONE PAGER is a duplicate view only
    # for invoices it shares with a daily sheet. 57 Oct/Nov 2025 invoices
    # (net 559,369.32) exist on the ONE PAGER alone - those are kept.
    orphan_rescue_roles: [one_pager]
    # "principal" is not a raw header anywhere - it only exists as the
    # provenance column Extract attaches (_principal). transform.py's
    # backfill_provenance_fields() (2026-08) copies _principal -> principal
    # right after apply_column_map, before dedup_facts runs, so the natural
    # key references the same bare "principal" schema.sql's Sales_Fact
    # UNIQUE constraint uses - not the underscore-prefixed provenance name.
    natural_key: [invoice_num, principal, region]

sales_unilever_sku_demand:
  unilever:
    doc_type: unilever_sku
    # Sole source for this fact (ARCHITECTURE.md §5.1, DEC-03) — no other
    # sheet/doc_type competes for it, so there is nothing to cross-check.
    system_of_record_role: data
    cross_check_roles: []
    natural_key: [sku_code, calendar_month]   # matches schema.sql's
                                                # Unilever_SKU_Demand_Fact
                                                # UNIQUE(sku_code, calendar_month)

sales_return:
  both:
    # SYSTEM-OF-RECORD CHANGED 2026-09-09 (Phase 1 re-check, Yuan approved):
    # rmr_gs_bo -> sales_return.
    #
    # Why: rmr_gs_bo is the RMR Good-Stock / Bad-Order export and exists for
    # only 2 months of real data (2025 October, 2025 November — 12 sheets).
    # The `sales_return` family is the fuller record: 68 staged sheets,
    # 1,931 rows, contiguous 2023-01 → 2026-08, both regions, and it carries
    # a real `Invoice Num` and `REFNBR` column that rmr_gs_bo lacks entirely.
    # It is the honest system of record for SalesReturn_Fact.
    #
    # rmr_gs_bo drops to cross-check (never loaded) — see
    # cross_check_doc_types below. Its 44 dedup conflicts stop mattering
    # once it is no longer promoted.
    doc_type: sales_return
    system_of_record_role: [gs, bo, data]
    # _sheet_role vocab for this family: gs (851 rows) / bo (309) /
    # data (771, the pre-2025 single-sheet shape that never split GS/BO).
    # All three carry real return rows and load. one_pager (GS ∪ BO,
    # 2025 shape only) is the cross-check, never loaded.
    cross_check_roles: [one_pager]
    cross_check_doc_types: [rmr_gs_bo]
    # rmr_gs_bo shares this fact's grain but is now a cross-check only:
    # transform_driver demotes it (no owning fact) instead of promoting +
    # deduping it. If a future reconciliation wants to compare the RMR
    # Oct/Nov-2025 figures against sales_return for the same months, that
    # is a cross-check report, not a second load path.
    #
    # EXCEPTION, fix 4 (Yuan 2026-09-28, migration 0028; a loader rule since
    # 2026-09-30): no monthly sales-return file exists for these months, so
    # the RMR export's GS and BO sheets ARE loaded for them (source = 'rmr',
    # never the ONE PAGER). Only the periods listed here - scripts/load_slices.py
    # reads this list and refuses an RMR slice for any other month. When a
    # real sales-return file for one of these months arrives, 0028's dedupe
    # rule runs in that slice's transaction (see load_slices.rmr_dedupe).
    rmr_fallback:
      doc_type: rmr_gs_bo
      system_of_record_role: [gs, bo]
      allowed_periods: ["2025-10", "2025-11"]
    natural_key: [return_slip_num, principal, region, invoice_num]
    # WIDENED 2026-09-11 (Phase 1 step 2b, Yuan approved): added invoice_num.
    # Confirmed against all 20 real transform-stage conflicts (see
    # reports/PHASE1_EXECUTION_PLAN_2026-09.md): 18 of 20 are the SAME
    # return_slip_num genuinely reused across two different real returns —
    # different invoice_num, different date, different amount every time,
    # no exceptions found. invoice_num separates every one of those 18
    # cleanly; it is real data (only 19/1931 rows null) and was already
    # present on the fact, just not in the key.
    #
    # `region` is SITE level (pangasinan / ilocos) from Extract's _region
    # provenance — NOT "Town Display" (the town, half-blank).
    # column_maps/sales_return.yaml deliberately does not map `region`, so
    # transform.backfill_provenance_fields() fills it from _region cleanly
    # (contrast rmr_gs_bo.yaml, which maps region <- "Town Display" — a
    # latent bug, now moot as rmr_gs_bo is cross-check).
    #
    # return_type DROPPED from this key 2026-09-14 (Phase 1d, first real
    # canonical load): this key was left widened-but-mismatched against
    # migration 0011's actual DB constraint as a tracked blocker ("NOT YET
    # FIXED AT LOAD" — see prior revision of this comment); running the
    # real load surfaced it as a hard failure (Postgres: "no unique or
    # exclusion constraint matching the ON CONFLICT specification"), which
    # forces the already-documented resolution rather than leaving it open.
    # Migration 0011 itself already chose (a) DROP return_type, not (b)
    # COALESCE it into the key — empirically equivalent (1 colliding group
    # of 3 rows either way, verified against the real 1,383-row corpus,
    # see that migration's own comment) and simpler DDL. This YAML key now
    # matches that constraint exactly: (return_slip_num, principal, region,
    # invoice_num). Re-verified 2026-09-11 (before this edit, informally;
    # now load-bearing): dropping return_type drops real quarantined from
    # 773 to 8 (only rows genuinely missing return_slip_num or invoice_num).
    #
    # A row with a NULL invoice_num or return_slip_num is UNRESOLVABLE
    # under this key — dedup_facts() (2026-09-11 fix) quarantines such rows
    # individually rather than grouping them, matching Postgres' own NULL
    # <> NULL UNIQUE semantics.
    #
    # DATA-QUALITY FLAGS, fixed at transform 2026-09-11:
    #   - 7 real rows (of 11 staged incl. demo) had Return Type == "Return
    #     Type" (an unstripped header row) — now excluded by
    #     exclude_sales_return_header_rows(), same function that also drops
    #     the "Good Stock" / "Bad Stock" section-marker rows (25 rows across
    #     2 groups, mistakenly reported as conflicts before this fix — see
    #     the Phase 1 report).
    #   - Real rows with a genuinely null Return Slip # (4, after the
    #     header/marker rows above are excluded) are quarantined
    #     individually by dedup_facts(), never grouped together.

purchase:
  both:
    doc_type: purchase_order   # DEC-07 fix: was "purchases", didn't match
                                 # Extract's real _doc_type tag
    system_of_record_role: data
    cross_check_roles: []
    # Fixed 2026-08 (Transform reconciliation, story #16): matches
    # schema.sql's Purchase_Fact UNIQUE(invoice_num, principal, region) -
    # invoice_num alone would collide same-invoice-number purchases across
    # different regions/principals. principal/region come from
    # transform.backfill_provenance_fields() where no raw header maps them.
    # 2026-09-21 (completeness audit F2, migration 0025): invoice_date joined
    # the key. The September 2025 Pangasinan sheet reuses August's bill numbers
    # (BILL/2025/0236-0253) on 18 purchases with their own date, PO and
    # untaxed amount - a different purchase, not a second copy.
    natural_key: [invoice_num, principal, region, invoice_date]  # BILL/... prefix or PO ref

inventory:
  both:
    doc_type: inventory_sign_off   # DEC-07 fix: was "inventory", didn't match
                                     # Extract's real _doc_type tag
    system_of_record_role: data
    cross_check_roles: []
    # ssis_summary is a different _doc_type, not a _sheet_role within this
    # one — same class of bug DEC-07 fixed for daily_sales_report above;
    # cross_check_roles can't express it, cross_check_doc_types can.
    # T3 Option A CLOSED (2026-07) — ssis_summary Extract driver exists.
    cross_check_doc_types: [ssis_summary]
    # sku_code and snapshot_date are NOT raw headers - neither exists as
    # a literal column anywhere in the source (confirmed via profiling).
    # Both are computed by transform.py, not renamed by
    # column_maps/inventory_sign_off.yaml:
    #   - sku_code: parsed out of sku_description_raw by
    #     transform.split_sku_description() (leading alphanumeric token,
    #     e.g. "9DMR56831" from "9DMR56831 DM QUICK N EASY..."). Rows
    #     that don't match the pattern get sku_code=null and are flagged,
    #     never guessed.
    #   - snapshot_date: filled from the _period provenance column
    #     (these exports are monthly, so _period is the honest proxy -
    #     there's no finer-grained date in the sheet itself).
    # Fixed 2026-08 (Transform reconciliation, story #16): matches
    # schema.sql's Inventory_Fact UNIQUE(sku_code, snapshot_date, region) -
    # without region, two real rows (same SKU/month, Pangasinan vs Ilocos)
    # would collapse into one key and dedup_facts() would silently keep
    # only one region's inventory count. inventory_sign_off has no raw
    # "region" header (confirmed via column_maps/inventory_sign_off.yaml),
    # so this comes from transform.backfill_provenance_fields() (_region).
    natural_key: [sku_code, snapshot_date, region]
  unilever:
    doc_type: ssis_soh   # New driver (analytics/etl/extract/ssis_soh.py),
                          # 2026-08 — the SOH(<date>) sheet embedded in SSIS
                          # Sales Summary Report workbooks. Real, SKU-level
                          # Unilever inventory-on-hand snapshots. See
                          # reports/SOH_PROFILE.md for the discovery pass and
                          # this doc_type's rulings (R1-R7) as implemented.
    system_of_record_role: data
    cross_check_roles: []
    # ssis_summary is a different _doc_type (the file this sheet lives
    # inside is classified ssis_summary at file-selection time; every
    # OTHER sheet in the same workbook — RAW DATA, INVENTORY, etc. — is
    # staged under _doc_type=ssis_summary, not ssis_soh). Same class of
    # note as inventory.both's cross_check_doc_types above.
    cross_check_doc_types: [ssis_summary]
    # No Storage Location in this key (R6: dropped at Extract, confirmed
    # single-valued "SALE" across the whole corpus — carries no
    # discriminating information, unlike inventory.both's region, which
    # is a real Pangasinan/Ilocos split).
    #
    # Uniqueness PROVEN against real staged data, not assumed: an
    # EXTRACT-ONLY run (2026-08) against data/raw/ under rulings R1-R7
    # staged 39 in-scope snapshots (2023-01 reporting period onward),
    # 27,321 rows total. Grouping the staged rows by
    # (sku_code, snapshot_date) produced ZERO groups with more than one
    # row — the natural key below is unique in-scope, confirmed by
    # actual dedup arithmetic, not by inspection. (39 rows have a null
    # sku_code — one per snapshot, a blank/totals-adjacent row in the
    # source sheet — those don't collide with anything real, and
    # transform_fact() should decide separately whether to keep or drop
    # them; this key's uniqueness claim is about the non-null rows.)
    natural_key: [sku_code, snapshot_date]

sell_out:
  delmonte:
    doc_type: sell_out
    system_of_record_role: data
    cross_check_roles: []
    # Same as inventory above — SALES PER CUSTOMER lives in the
    # ssis_summary doc_type, not as a sheet_role inside sell_out itself.
    # T3 Option A CLOSED (2026-07) — ssis_summary Extract driver exists.
    cross_check_doc_types: [ssis_summary]
    # column_maps/sell_out.yaml's canonical field is "category_path", not
    # "category" - and there is no period cell in the sheet (see that
    # file's comment), only the _period provenance tag. Key must
    # reference the real post-mapping / provenance names.
    # Fixed 2026-08 (Transform reconciliation, story #16): matches
    # schema.sql's SellOut_Fact UNIQUE(category_path, region, _period) -
    # sell_out has no raw "region" header either (same gap as inventory
    # above), so region comes from backfill_provenance_fields() (_region).
    natural_key: [category_path, region, _period]
